services:
  db:
    image: postgres:16-alpine
    container_name: broadcast-workbench-db
    environment:
      POSTGRES_USER: broadcast
      POSTGRES_PASSWORD: broadcast
      POSTGRES_DB: broadcast
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U broadcast']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
